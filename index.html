<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Perfect Repo Cloner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 3px solid #ff6b81;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: #ff4757;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .card input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            margin-bottom: 15px;
            border: 2px solid #ffa502;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            text-align: center;
            background-color: #fffaf0;
            color: #2f3542;
            transition: all 0.3s ease;
        }

        .card input:focus {
            border-color: #ff4757;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.3);
        }

        .card input::placeholder {
            color: #a4b0be;
            font-weight: 500;
        }

        .action-btn {
            width: 100%;
            max-width: 300px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s ease;
        }

        .action-btn:hover {
            background-color: #e84118;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #2f3542;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">🚀 Full Repository Cloner</h1>
        
        <input type="text" id="repoName" placeholder="New Repository Name">

        <button type="button" class="action-btn" onclick="createAndCopyRepo()">Create & Copy</button>
        
        <div id="status"></div>
    </div>

    <script>
        const GITHUB_USERNAME = "technolex-hack"; 
        const SOURCE_REPO = "hbd-rena";

        async function getValidToken() {
            let token = localStorage.getItem('gh_pat');
            if (!token) {
                token = prompt("GitHub Personal Access Token (PAT) നൽകുക:");
                if (token) {
                    localStorage.setItem('gh_pat', token.trim());
                }
            }
            return token;
        }

        async function createAndCopyRepo() {
            const newRepoName = document.getElementById('repoName').value.trim();
            const status = document.getElementById('status');

            if (!newRepoName) {
                status.innerText = "ദയവായി പുതിയ റിപ്പോസിറ്ററിയുടെ പേര് നൽകുക.";
                status.style.color = "red";
                return;
            }

            const token = await getValidToken();
            if (!token) {
                status.innerText = "ടോക്കൺ ലഭ്യമല്ല.";
                status.style.color = "red";
                return;
            }

            status.innerText = "പുതിയ റിപ്പോസിറ്ററി ക്രിയേറ്റ് ചെയ്യുന്നു...";
            status.style.color = "#ff4757";

            try {
                // 1. പുതിയ repo സൃഷ്ടിക്കുന്നു
                const createRes = await fetch('https://api.github.com/user/repos', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: newRepoName,
                        private: false,
                        auto_init: true
                    })
                });

                if (!createRes.ok) {
                    const errData = await createRes.json();
                    if (errData.message === "Bad credentials") {
                        localStorage.removeItem('gh_pat');
                    }
                    throw new Error(errData.message || "റിപ്പോസിറ്ററി നിർമ്മാണം പരാജയപ്പെട്ടു.");
                }

                status.innerText = "hbd-rena യിൽ നിന്നുള്ള Git Tree ഫെച്ച് ചെയ്യുന്നു...";

                // 2. Main branch-ന്റെ ഏറ്റവും പുതിയ commit SHA കണ്ടുപിടിക്കുന്നു
                const refRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${SOURCE_REPO}/git/ref/heads/main`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const refData = await refRes.json();
                const latestCommitSha = refData.object.sha;

                // 3. source repo-യുടെ കംപ്ലീറ്റ് Tree SHA കണ്ടുപിടിക്കുന്നു
                const commitRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${SOURCE_REPO}/git/commits/${latestCommitSha}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const commitData = await commitRes.json();
                const sourceTreeSha = commitData.tree.sha;

                status.innerText = "ഫയലുകൾ പുതിയ റിപ്പോസിറ്ററിയിലേക്ക് മാപ്പ് ചെയ്യുന്നു...";

                // 4. പുതിയ repo-യിൽ പുതിയ commit ക്രിയേറ്റ് ചെയ്യുന്നു (Direct Source Tree Pointer വഴി)
                const newCommitRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${newRepoName}/git/commits`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Initial clone from hbd-rena",
                        tree: sourceTreeSha
                    })
                });

                if (!newCommitRes.ok) throw new Error("Commit സൃഷ്ടിക്കാൻ കഴിഞ്ഞില്ല.");
                const newCommitData = await newCommitRes.json();

                // 5. പുതിയ repo-യുടെ main branch പുതിയ commit-ലേക്ക് update ചെയ്യുന്നു
                await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${newRepoName}/git/refs/heads/main`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sha: newCommitData.sha,
                        force: true
                    })
                });

                status.innerText = `വിജയകരമായി പൂർത്തിയായി! README ഉൾപ്പെടെ എല്ലാ ഫോൾഡറുകളും കോപ്പിയായി. Repo: ${newRepoName}`;
                status.style.color = "green";

            } catch (err) {
                status.innerText = `Error: ${err.message}`;
                status.style.color = "red";
            }
        }
    </script>

</body>
</html>
