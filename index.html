<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repo Cloner UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 3px solid #ff6b81;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: #ff4757;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .card input {
            width: 100%;
            max-width: 300px;
            padding: 14px 18px;
            margin-bottom: 15px;
            border: 2px solid #ffa502;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            text-align: center;
            background-color: #fffaf0;
            color: #2f3542;
            transition: all 0.3s ease;
        }

        .card input:focus {
            border-color: #ff4757;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.3);
        }

        .card input::placeholder {
            color: #a4b0be;
            font-weight: 500;
        }

        .action-btn {
            width: 100%;
            max-width: 300px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s ease;
        }

        .action-btn:hover {
            background-color: #e84118;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #2f3542;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">🚀 Clone Repository</h1>
        
        <input type="text" id="repoName" placeholder="New Repository Name">

        <button type="button" class="action-btn" onclick="createAndCopyRepo()">Create & Copy</button>
        
        <div id="status"></div>
    </div>

    <script>
        // ഈ ഭാഗത്ത് നിങ്ങളുടെ GitHub വിവരങ്ങൾ നൽകുക
        const GITHUB_USERNAME = "technolex-hack"; 
        const GITHUB_TOKEN = "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"; 

        async function createAndCopyRepo() {
            const newRepoName = document.getElementById('repoName').value.trim();
            const status = document.getElementById('status');

            if (!newRepoName) {
                status.innerText = "ദയവായി പുതിയ റിപ്പോസിറ്ററിയുടെ പേര് നൽകുക.";
                status.style.color = "red";
                return;
            }

            status.innerText = "പുതിയ റിപ്പോസിറ്ററി നിർമ്മിക്കുന്നു...";
            status.style.color = "#ff4757";

            try {
                // 1. പുതിയ റിപ്പോസിറ്ററി ക്രിയേറ്റ് ചെയ്യുന്നു
                const createRes = await fetch('https://api.github.com/user/repos', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: newRepoName,
                        private: false,
                        auto_init: true
                    })
                });

                if (!createRes.ok) {
                    const errData = await createRes.json();
                    throw new Error(errData.message || "റിപ്പോസിറ്ററി നിർമ്മാണം പരാജയപ്പെട്ടു.");
                }

                status.innerText = "ഫയലുകൾ hbd-rena യിൽ നിന്ന് പകർത്തുന്നു...";

                // 2. hbd-rena യിലെ ഫയലുകൾ എടുക്കുന്നു
                const sourceRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/hbd-rena/contents`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!sourceRes.ok) throw new Error("hbd-rena ഫയലുകൾ കണ്ടെത്താനായില്ല.");
                const files = await sourceRes.json();

                // 3. ഓരോ ഫയലും പുതിയ റിപ്പോസിറ്ററിയിലേക്ക് പുഷ് ചെയ്യുന്നു
                for (let file of files) {
                    if (file.type === 'file') {
                        const fileDataRes = await fetch(file.url, {
                            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                        });
                        const fileData = await fileDataRes.json();

                        await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${newRepoName}/contents/${file.name}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Copy ${file.name} from hbd-rena`,
                                content: fileData.content
                            })
                        });
                    }
                }

                status.innerText = `വിജയകരമായി പൂർത്തിയായി! Repo: ${newRepoName}`;
                status.style.color = "green";

            } catch (err) {
                status.innerText = `Error: ${err.message}`;
                status.style.color = "red";
            }
        }
    </script>

</body>
</html>
